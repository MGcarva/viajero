{% extends "base.html" %}
{% block title %}Iniciar sesión - Viajero{% endblock %}
{% block body_class %}pagina-login{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Iniciar sesión</h1>
  <form id="form-login" class="auth-form">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password">

    <button type="submit" id="btn-submit">Entrar</button>
  </form>
  <p class="auth-alt"><a href="/recuperar">¿Olvidaste tu contraseña?</a></p>
  <p class="auth-alt">¿No tenés cuenta? <a href="/registro">Registrate</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
  redirigirSiAutenticado("/");

  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("btn-submit");
    btn.disabled = true;
    btn.textContent = "Entrando...";

    const resp = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const datos = await resp.json();

    if (!resp.ok) {
      mostrarToast(datos.detail || "No se pudo iniciar sesión.", "error");
      btn.disabled = false;
      btn.textContent = "Entrar";
      return;
    }

    const { error } = await supabaseClient.auth.setSession({
      access_token: datos.access_token,
      refresh_token: datos.refresh_token,
    });

    if (error) {
      mostrarToast(error.message, "error");
      btn.disabled = false;
      btn.textContent = "Entrar";
      return;
    }
    window.location.href = "/";
  });
</script>
{% endblock %}
