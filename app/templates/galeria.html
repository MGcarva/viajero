{% extends "base.html" %}
{% block title %}Fotos de viajes - Viajero{% endblock %}
{% block head %}
<style>
  .form-foto {
    display: flex;
    gap: 0.75rem;
    align-items: flex-end;
    flex-wrap: wrap;
    background: #161d24;
    border: 1px solid #26313a;
    border-radius: 12px;
    padding: 1.1rem 1.25rem;
    margin: 1rem 0 1.5rem 0;
  }
  .form-foto .campo {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .form-foto input[type="text"] {
    padding: 0.55rem 0.7rem;
    border-radius: 8px;
    border: 1px solid #2c3944;
    background: #0f1418;
    color: #e8ecef;
    min-width: 220px;
  }
  .form-foto button {
    padding: 0.6rem 1rem;
    border: none;
    border-radius: 8px;
    background: #2b6cb0;
    color: white;
    cursor: pointer;
  }
  .form-foto button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .galeria-fotos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
  }
  .tarjeta-foto {
    background: #161d24;
    border: 1px solid #26313a;
    border-radius: 12px;
    overflow: hidden;
  }
  .tarjeta-foto img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
  }
  .tarjeta-foto-info {
    padding: 0.75rem 0.9rem;
  }
  .tarjeta-foto-autor {
    font-size: 0.85rem;
    color: #4db8ff;
    font-weight: 600;
  }
  .tarjeta-foto-fecha {
    font-size: 0.75rem;
    color: #6b7885;
    margin-left: 0.4rem;
  }
  .tarjeta-foto-descripcion {
    font-size: 0.85rem;
    margin-top: 0.4rem;
  }
  .tarjeta-foto-eliminar {
    margin-top: 0.5rem;
    background: #26313a;
    color: #e8ecef;
    border: none;
    border-radius: 6px;
    padding: 0.4rem 0.7rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  #sin-fotos { color: #9fb0bd; }
</style>
{% endblock %}
{% block content %}
<p><a href="/">← Volver al mapa</a></p>
<h1>Fotos de viajes</h1>

<form id="form-foto" class="form-foto">
  <div class="campo">
    <label for="input-foto">Elegí una foto</label>
    <input type="file" id="input-foto" accept="image/*" required>
  </div>
  <div class="campo">
    <label for="descripcion-foto">Descripción (opcional)</label>
    <input type="text" id="descripcion-foto" maxlength="200" placeholder="Ej: Paso fronterizo, día 3">
  </div>
  <button type="submit" id="btn-subir-foto">Subir foto</button>
</form>

<p id="sin-fotos" hidden>Todavía no hay fotos. ¡Subí la primera!</p>
<div id="galeria-fotos" class="galeria-fotos"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/galeria.js?v={{ v }}"></script>
{% endblock %}
