{% extends "base.html" %}
{% block title %}Recuperar contraseña - Viajero{% endblock %}
{% block body_class %}pagina-login{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Recuperar contraseña</h1>
  <form id="form-recuperar" class="auth-form">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">

    <button type="submit" id="btn-submit">Enviar enlace</button>
  </form>
  <p class="auth-alt"><a href="/login">Volver a iniciar sesión</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
  redirigirSiAutenticado("/");

  document.getElementById("form-recuperar").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const btn = document.getElementById("btn-submit");
    btn.disabled = true;
    btn.textContent = "Enviando...";

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + "/restablecer",
    });

    btn.disabled = false;
    btn.textContent = "Enviar enlace";

    if (error) {
      mostrarToast(error.message, "error");
      return;
    }
    mostrarToast("Si el email existe, te enviamos un enlace para restablecer tu contraseña.", "success");
  });
</script>
{% endblock %}
